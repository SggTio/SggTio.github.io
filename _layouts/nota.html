---
layout: default
---

<article class="nota">
  <header class="nota-header">
    <h1 class="nota-title">{{ page.title }}</h1>
    {% if page.date %}
    <time datetime="{{ page.date | date_to_xmlschema }}" class="nota-date">
      {{ page.date | date: "%Y-%m-%d" }}
    </time>
    {% endif %}
    {% if page.description %}
    <p class="nota-lead">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="nota-content">
    {{ content }}
  </div>
</article>
