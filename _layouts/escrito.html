---
layout: default
---

<article class="escrito">
  <header class="escrito-header">
    <h1 class="escrito-title">{{ page.title }}</h1>
    {% if page.date %}
    <time datetime="{{ page.date | date_to_xmlschema }}" class="escrito-date">
      {{ page.date | date: "%Y-%m-%d" }}
    </time>
    {% endif %}
  </header>

  <div class="escrito-content">
    {{ content }}
  </div>
</article>
