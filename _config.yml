# Setup
title: Un Santajaro
tagline: Santiago Gil Gallego
description: "Escribo sobre lo que me gusta: matemáticas, computación, cuentos y poesía."
url: https://sggtio.github.io
lang: es
baseurl: ""
permalink: pretty

# Gems
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - CLAUDE.md
  - docs

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# ga_analytics: UA-000000-0

# Autor del blog
author:
  name: Santiago Gil Gallego
  url: https://github.com/SggTio
  email: santiagogilgallego@gmail.com

# Perfiles públicos. Los consume _includes/enlaces-sociales.html
social:
  email: santiagogilgallego@gmail.com
  github: SggTio
  twitter: Un_Santajaro
  instagram: snttrcio

# Custom vars
version: 3.0.0

# Navbar page list
nav:
  - title: Mates
    url: /mates/
    section: mates
  - title: Notas
    url: /notas/
    section: notas
  - title: Escritos
    url: /escritos/
    section: escritos
  - title: Sobre mí
    url: /sobre/
    section: sobre

# Una colección para cada categoría
collections:
  escritos:
    output: true
    permalink: /escritos/:name/
  mates:
    output: true
    permalink: /mates/:name/
  notas:
    output: true
    permalink: /notas/:name/
  proyectos:
    output: true
    permalink: /proyectos/:name/
  investigacion:
    output: true
    permalink: /investigacion/:name/
  series:
    output: true
    permalink: /series/:name/

# Valores por defecto para items de colecciones.
# Hereda `section` para que la navbar pueda marcar el link activo
# incluso dentro de un post individual de una colección.
defaults:
  - scope:
      path: ""
      type: "mates"
    values:
      section: "mates"
      layout: "post"
      area: "matematicas"
      genero: "articulo"
      nivel: "intermedio"
  - scope:
      path: ""
      type: "notas"
    values:
      section: "notas"
      layout: "nota"
      genero: "nota"
      nivel: "divulgativo"
  - scope:
      path: ""
      type: "escritos"
    values:
      # `section` pasa a "letras" en la Fase 7, junto con el permalink
      section: "escritos"
      layout: "escrito"
      genero: "cuento"

  # Colecciones nuevas. Sin carpeta todavía: no generan ninguna página.
  - scope:
      path: ""
      type: "proyectos"
    values:
      section: "proyectos"
      layout: "proyecto"
      estado: "en-desarrollo"
      draft: true
  - scope:
      path: ""
      type: "investigacion"
    values:
      section: "investigacion"
      layout: "linea-investigacion"
  - scope:
      path: ""
      type: "series"
    values:
      section: "escritos"
      layout: "serie"
