<!-- @dsCard height=300 -->
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<div style="position:relative;width:960px;height:300px;background:var(--fondo);overflow:hidden;font-family:var(--font-serif)">
  <!--
    Derivación
    bloques: azulgris 240×240 (espacio-7×5) como la columna de texto; crema 96×128 (espacio-8×2 / espacio-9+espacio-6) como la columna de margen; verde 96×64 (espacio-8) como la ficha; radio-0 en todos.
    disposición: una losa alta con dos satélites a su derecha, separados por hueco espacio-7 (48px): es la composición texto + margen del sitio.
    patrón: fila «editorial, serif, reglas en vez de sombras» → cuatro reglas horizontales a paso espacio-7 (48px) cortadas del fondo sobre los bloques, como la retícula de base que alinea el margen con el texto.
    escalas: espacio-6 (32) de inset, espacio-7 (48) de paso y hueco, radio-0.
  -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true" style="position:absolute;inset:0">
    <style>
      .texto { fill: var(--azulgris); }
      .margen { fill: var(--crema); }
      .ficha { fill: var(--verde); }
      .regla { stroke: var(--fondo); stroke-width: 1; }
      .bloque { rx: var(--radio-0); }
    </style>
    <rect class="texto bloque" x="528" y="32" width="240" height="240"/>
    <rect class="margen bloque" x="816" y="32" width="96" height="128"/>
    <rect class="ficha bloque" x="816" y="208" width="96" height="64"/>
    <line class="regla" x1="504" y1="80" x2="960" y2="80"/>
    <line class="regla" x1="504" y1="128" x2="960" y2="128"/>
    <line class="regla" x1="504" y1="176" x2="960" y2="176"/>
    <line class="regla" x1="504" y1="224" x2="960" y2="224"/>
  </svg>
  <div style="position:absolute;left:32px;bottom:36px;max-width:440px">
    <div style="font-size:64px;line-height:.95;font-weight:500;font-variation-settings:'opsz' 64;letter-spacing:-.01em;color:var(--tinta)">Un Santajaro</div>
    <div style="font-family:var(--font-sans);font-size:13px;line-height:1.4;color:var(--tinta-tenue);margin-top:14px">matemáticas, computación, cuentos y poesía</div>
  </div>
</div>
